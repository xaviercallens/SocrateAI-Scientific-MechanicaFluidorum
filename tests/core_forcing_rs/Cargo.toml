[package]
name = "core_forcing"
version = "0.1.0"
edition = "2021"

# The Tier B forcing evaluator. NO floating point anywhere: all arithmetic is fixed-point on
# i128 with explicit directed rounding, which is exact-rational interval arithmetic in
# disguise (see docs/designs/CORE_TAIL_CAP.md section 5).
[dependencies]
rayon = "1"
serde_json = "1"

[profile.release]
opt-level = 3
